<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CMPJ NOTES</title>
<style>
:root{--b:#1877F2;--bg:#F0F2F5;--t:#050505;--m:#65676B;--l:#CED0D4}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 "Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--t)}
.top{position:sticky;top:0;z-index:5;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);padding:8px 16px;display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:50%;background:var(--b);color:#fff;font:700 22px/40px Helvetica,Arial;text-align:center}
.top b{font-size:20px;color:var(--b)}.top span{margin-left:auto;color:var(--m)}
.wrap{display:grid;grid-template-columns:270px 1fr;gap:16px;padding:16px;max-width:1500px;margin:auto}
.side a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.side a:hover{background:#e4e6eb}.side a.on{background:#e7f3ff;color:var(--b)}.side h4{margin:14px 10px 4px;color:var(--m);font-size:13px;font-weight:600}
.card{background:#fff;border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.2);padding:16px;margin-bottom:16px}
h2{margin:0 0 12px;font-size:22px}h3{margin:0 0 10px;font-size:17px}
button,.btn{background:var(--b);color:#fff;border:0;border-radius:6px;padding:8px 14px;font:600 14px inherit;font-family:inherit;cursor:pointer}
button:hover{filter:brightness(.93)}button.g{background:#e4e6eb;color:var(--t)}button.r{background:#fde8e8;color:#c0262d}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--b);outline-offset:1px}
input,select,textarea{font:inherit;border:1px solid var(--l);border-radius:6px;padding:8px 10px;background:#f5f6f7;max-width:100%}
input[type=checkbox]{width:auto}label{display:block;margin:8px 0 4px;color:var(--m);font-size:13px;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.fc{cursor:pointer;border:1px solid var(--l);border-radius:8px;padding:14px;background:#fff}.fc:hover{background:#f5f6f7}.fc b{display:block;font-size:16px}.fc small,small{color:var(--m)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--l);margin-bottom:14px}.tabs a{padding:10px 14px;cursor:pointer;font-weight:600;color:var(--m);border-bottom:3px solid transparent}.tabs a.on{color:var(--b);border-color:var(--b)}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{border:1px solid var(--l);padding:4px 6px;text-align:center}th{background:#f5f6f7;font-size:13px}th small{display:block;font-weight:400}
.gt td.nm,.gt th:first-child{position:sticky;left:0;background:#fff;text-align:left;min-width:170px;z-index:1}.gt input{width:58px;text-align:center;padding:5px}
.chip{display:inline-block;background:#e7f3ff;color:var(--b);border-radius:12px;padding:2px 9px;margin:2px;font-size:13px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#242526;color:#fff;padding:10px 18px;border-radius:8px;display:none;z-index:9}
.lg{min-height:100vh;display:grid;place-items:center;padding:20px}.lg>div{display:grid;grid-template-columns:1fr 380px;gap:50px;align-items:center;max-width:900px}
.lg h1{color:var(--b);font-size:46px;margin:0}.lg p{font-size:20px;color:#1c1e21}.lg .card{padding:20px}.lg input{width:100%;margin:5px 0;padding:13px}.lg button{width:100%;padding:12px;font-size:17px;margin-top:6px}
#bul{display:none}.pg{background:#fff;color:#000;padding:18px 24px;margin:0 auto 16px;max-width:820px;font-size:13px;border:1px solid var(--l)}
.hd{display:flex;align-items:center;gap:14px;text-align:center}.hd img{height:70px}.hd div{flex:1;white-space:pre-line;font-size:12px}.pg h2{text-align:center;font-size:18px;margin:14px 0 8px}
.pg table{font-size:12.5px;margin-bottom:8px}.pg td:first-child{text-align:left}.pg .sec td{background:#eee;font-weight:700;text-align:left}.sum td{font-weight:700}
.sg{display:flex;justify-content:space-between;margin-top:14px;text-align:center;gap:8px}.sg div{flex:1;min-height:100px}.sg img{height:60px;display:block;margin:6px auto}
#splash{position:fixed;inset:0;z-index:99;background:radial-gradient(circle at 50% 40%,#2d88ff,#1877F2 45%,#0a4cb0);display:grid;place-content:center;justify-items:center;gap:22px;transition:opacity .55s,visibility .55s}
#splash.out{opacity:0;visibility:hidden}
.orb{position:relative;width:200px;height:200px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 12px 40px rgba(0,0,0,.28);animation:pop .8s cubic-bezier(.2,1.3,.4,1) both}
.orb::before,.orb::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid rgba(255,255,255,.7);animation:ring 1.8s ease-out .6s infinite}
.orb::after{animation-delay:1.2s}
.orb img{width:164px;height:164px;border-radius:50%;object-fit:cover;animation:spin 1.2s cubic-bezier(.2,.8,.2,1) .25s both}
#splash b{color:#fff;font-size:26px;animation:fade .6s ease 1s both}#splash small{color:#dbe9ff;animation:fade .6s ease 1.2s both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes spin{from{transform:rotate(-200deg) scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(1.7);opacity:0}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.orb,.orb img,#splash b,#splash small,.orb::before,.orb::after{animation:none}}
@media(max-width:820px){.wrap{grid-template-columns:1fr}.side{display:flex;overflow-x:auto;gap:4px}.side h4{display:none}.lg>div{grid-template-columns:1fr}.lg h1{font-size:36px}}
@media print{body{background:#fff}body>*:not(#bul){display:none!important}#bul{display:block}.pg{border:0;margin:0;max-width:none;page-break-after:always}}
</style></head><body>

const parse=s=>(s||'').split(',').map(x=>{const i=x.lastIndexOf(':');return i<0?{l:x.trim(),c:1}:{l:x.slice(0,i).trim(),c:parseFloat(x.slice(i+1))||1}}).filter(x=>x.l);
const isAdmin=()=>S.me?.role==='admin',canSee=id=>isAdmin()||(S.me?.filieres||[]).includes(id);
const myFil=()=>S.fil.filter(f=>canSee(f.id)).sort((a,b)=>a.name.localeCompare(b.name));
const fmt=v=>v===''||v==null?'':Math.round(v*100)/100,r2=v=>(Math.round(v*100)/100).toFixed(2);

const errmsg=e=>({'auth/invalid-credential':'E-mail ou mot de passe incorrect.','auth/email-already-in-use':'Cet e-mail a déjà un compte.','auth/weak-password':'Mot de passe trop court (6 caractères minimum).','auth/wrong-password':'Ancien mot de passe incorrect.','auth/too-many-requests':'Trop de tentatives. Réessayez plus tard.','permission-denied':'Action non autorisée pour votre compte.'}[e.code]||e.message);

function calc(f,notes){const g=parse(f.general),t=[...parse(f.theo),...parse(f.prat)],n=l=>parseFloat(notes?.[l])||0,s=a=>a.reduce((x,y)=>x+n(y.l)*y.c,0),k=a=>a.reduce((x,y)=>x+y.c,0);
 const t1=s(g),t2=s(t),k1=k(g),k2=k(t);return{g,t,n,t1,t2,k1,k2,m1:k1?t1/k1:0,m2:k2?t2/k2:0,tot:t1+t2,mg:k1+k2?(t1+t2)/(k1+k2):0}}
const mention=m=>m>=16?'TB':m>=14?'Bien':m>=12?'AB':m>=10?'PASS':'';
const decision=m=>!m?'':m>=(+S.set.seuil||10)?'Admis':'Stage de reprise';
const rg=x=>x.rk===1?'1er':x.rk?x.rk+'e':'';
const gid=(f,s)=>f.id+'__'+s;
function rows(f){const r=S.stu.filter(s=>s.filiere===f.id).sort((a,b)=>a.name.localeCompare(b.name)).map(s=>({s,c:calc(f,S.gr[gid(f,s.id)]?.notes)}));r.forEach(x=>x.rk=x.c.mg>0?1+r.filter(y=>y.c.mg>x.c.mg).length:'');return r}

function dataSubs(){S.dsubs.forEach(u=>u());S.dsubs=[];S.gr={};if(!S.me)return;const ad=isAdmin(),fl=S.me.filieres||[];
 const on=(q,fn)=>S.dsubs.push(onSnapshot(q,s=>{fn(s);render()},e=>toast(errmsg(e))));
 on(collection(db,'filieres'),s=>S.fil=s.docs.map(d=>({id:d.id,...d.data()})));
 on(doc(db,'settings','main'),d=>S.set=d.data()||{});
 if(ad)on(collection(db,'users'),s=>S.users=s.docs.map(d=>({id:d.id,...d.data()})));
 const q=c=>ad?collection(db,c):fl.length?query(collection(db,c),where('filiere','in',fl.slice(0,30))):null;
 let a=q('students');if(a)on(a,s=>S.stu=s.docs.map(d=>({id:d.id,...d.data()})));
 a=q('grades');if(a)on(a,s=>S.gr=Object.fromEntries(s.docs.map(d=>[d.id,d.data()])));}
if(ok){const app=initializeApp(CFG);auth=getAuth(app);db=getFirestore(app);
 onAuthStateChanged(auth,u=>{S.subs.forEach(x=>x());S.subs=[];S.dsubs.forEach(x=>x());S.dsubs=[];S.user=u;S.me=null;S.meLoaded=false;
  if(u){S.subs.push(onSnapshot(doc(db,'users',u.uid),async d=>{S.me=d.exists()?d.data():null;S.meLoaded=true;if(!S.me)S.canInit=!(await getDoc(doc(db,'meta','init')).catch(()=>({exists:()=>true}))).exists();dataSubs();render()},e=>{S.meLoaded=true;toast(errmsg(e));render()}))}

 if(t==='stu')body=`${ed?`<label>Ajouter des élèves (un nom par ligne)</label><textarea id="sn" rows="4" style="width:100%"></textarea><p><button data-act="addStu">Ajouter</button></p>`:''}<table>${r.map(x=>`<tr><td style="text-align:left">${esc(x.s.name)}</td><td style="width:90px">${ed?`<button class="r" data-act="delStu" data-s="${x.s.id}">Retirer</button>`:''}</td></tr>`).join('')}</table>`;
 if(t==='bul')body=`<div class="row"><button data-act="printAll">Imprimer tous les bulletins</button></div><table style="margin-top:10px">${r.map(x=>`<tr><td style="text-align:left">${esc(x.s.name)}</td><td>${r2(x.c.mg)}</td><td style="width:110px"><button class="g" data-act="print" data-s="${x.s.id}">Imprimer</button></td></tr>`).join('')}</table>`;
 return `<div class="card"><div class="row"><h2 style="margin:0">${esc(f.name)}</h2><span style="margin-left:auto"></span><button class="g" data-act="export">Exporter en Excel</button></div></div><div class="card"><div class="tabs">${tab('notes','Notes')}${tab('stu','Élèves')}${tab('bul','Bulletins')}</div>${body}</div>`}
function usersView(){const fl=[...S.fil].sort((a,b)=>a.name.localeCompare(b.name)),chk=(u)=>fl.map(f=>`<label style="display:inline-block;margin:2px 8px 2px 0;font-weight:400"><input type="checkbox" class="uf" value="${f.id}" ${u&&(u.filieres||[]).includes(f.id)?'checked':''}> ${esc(f.name)}</label>`).join('');
 return `<div class="card"><h2>Créer un compte</h2><div class="row"><input id="un" placeholder="Nom complet"><input id="ue" type="email" placeholder="E-mail"><input id="up" placeholder="Mot de passe provisoire"><select id="ur"><option value="formateur">Formateur</option><option value="admin">Administrateur</option></select></div><label>Filières accessibles</label><div id="nf">${chk(null)||'<small>Créez d\'abord des filières.</small>'}</div><p><button data-act="createUser">Créer le compte</button></p><small>Communiquez le mot de passe provisoire à la personne : elle le changera dans « Mon compte ».</small></div>
 <div class="card"><h2>Comptes existants</h2>${S.users.map(u=>`<div class="card" style="box-shadow:none;border:1px solid var(--l)" data-u="${u.id}"><b>${esc(u.name)}</b> <small>${esc(u.email)}</small><div class="row"><select class="ur"><option value="formateur" ${u.role!=='admin'?'selected':''}>Formateur</option><option value="admin" ${u.role==='admin'?'selected':''}>Administrateur</option></select></div><div>${chk(u)}</div><div class="row"><button data-act="saveUser" data-u="${u.id}">Enregistrer</button><button class="g" data-act="resetUser" data-e="${esc(u.email)}">Envoyer un lien de nouveau mot de passe</button><button class="r" data-act="delUser" data-u="${u.id}">Retirer l'accès</button></div></div>`).join('')}</div>`}
function filedView(){const inp=(id,k,l,v)=>`<label>${l}</label><input data-id="${id}" data-k="${k}" value="${esc(v)}" style="width:100%">`;
 return `<div class="card"><h2>Filières</h2><p><small>Matières au format « Nom:coefficient », séparées par des virgules.</small></p><div class="row"><button data-act="newFil">Ajouter une filière</button>${S.fil.length?'':'<button class="g" data-act="models">Charger les modèles (Chaudronnerie, Mécanique auto, Paramédical)</button>'}</div></div>${[...S.fil].sort((a,b)=>a.name.localeCompare(b.name)).map(f=>`<div class="card">${inp(f.id,'name','Nom de la filière',f.name)}${inp(f.id,'general','Enseignement général',f.general)}${inp(f.id,'theo','Formation technique : théorique',f.theo)}${inp(f.id,'prat','Formation technique : pratique',f.prat)}<p class="row"><button data-act="saveFil" data-f="${f.id}">Enregistrer</button><button class="r" data-act="delFil" data-f="${f.id}">Supprimer</button></p></div>`).join('')}`}
function setView(){const o=S.set,img=(k,l)=>`<label>${l}</label><div class="row">${o[k]?`<img src="${o[k]}" style="height:50px;background:#fff;border:1px solid var(--l)">`:''}<input type="file" accept="image/*" data-img="${k}">${o[k]?`<button class="g" data-act="clrImg" data-k="${k}">Retirer</button>`:''}</div>`;
 return `<div class="card"><h2>Réglages du bulletin</h2><label>En-tête (une ligne par texte, centré)</label><textarea id="sl" rows="6" style="width:100%">${esc(o.lines||'REPUBLIQUE DU CAMEROUN\nPaix - Travail - Patrie\nCENTRE MULTIFONCTIONNEL DE PROMOTION DES JEUNES DE REFERENCE DE DOUALA')}</textarea><label>Session</label><input id="ss" value="${esc(o.session||'SESSION DE NOVEMBRE 2026')}" style="width:100%"><label>Moyenne minimale pour « Admis »</label><input id="sd" type="number" step="0.5" value="${esc(o.seuil||10)}">${img('logo','Logo')}<label><input type="checkbox" id="so" ${o.sigOn?'checked':''}> Imprimer les signatures numériques (sinon un espace vide est laissé pour signer à la main)</label>${img('sig1','Signature : Chargé de mission N°2')}${img('sig2','Signature : Chargé de mission N°1')}${img('sig3','Signature : Chef de Centre')}<p><button data-act="saveSet">Enregistrer les réglages</button></p></div>`}
function accView(){return `<div class="card"><h2>Mon compte</h2><p>${esc(S.me.name)} · ${esc(S.user.email)}</p><label>Ancien mot de passe</label><input id="po" type="password" autocomplete="current-password"><label>Nouveau mot de passe</label><input id="pn" type="password" autocomplete="new-password"><p><button data-act="chpw">Changer le mot de passe</button></p></div>`}

/* ---- bulletin ---- */
function bulletin(f,x){const o=S.set,c=x.c,sec=(t,a)=>`<tr class="sec"><td colspan="4">${t}</td></tr>${a.map(y=>`<tr><td>${esc(y.l)}</td><td>${fmt(S.gr[gid(f,x.s.id)]?.notes?.[y.l]??'')}</td><td>${y.c}</td><td>${fmt(c.n(y.l)*y.c)}</td></tr>`).join('')}`;
 const sg=(k,l)=>`<div>${l}${o.sigOn&&o[k]?`<img src="${o[k]}">`:''}</div>`;
 return `<div class="pg"><div class="hd"><img src="${o.logo||DEF_LOGO}"><div>${esc(o.lines||'')}</div></div><h2>BULLETIN DE NOTES<br><small>${esc(o.session||'')}</small></h2><p><b>Nom et prénoms :</b> ${esc(x.s.name)}<br><b>Filière :</b> ${esc(f.name)}</p>
 <table><tr><th>Matière</th><th>Note /20</th><th>Coef</th><th>Points</th></tr>${sec('ENSEIGNEMENT GÉNÉRAL',c.g)}<tr class="sum"><td>Total / Moyenne 1</td><td>${r2(c.m1)}</td><td>${c.k1}</td><td>${fmt(c.t1)}</td></tr>${sec('FORMATION TECHNIQUE',c.t)}<tr class="sum"><td>Total / Moyenne 2</td><td>${r2(c.m2)}</td><td>${c.k2}</td><td>${fmt(c.t2)}</td></tr></table>
 <table class="sum"><tr><td>Moyenne générale</td><td>${r2(c.mg)}</td><td>Rang</td><td>${rg(x)}</td></tr><tr><td>Mention</td><td>${mention(c.mg)}</td><td>Décision</td><td>${decision(c.mg)}</td></tr></table>
 <div class="sg">${sg('sig1','Le Chargé de mission DR/JEC N°2')}${sg('sig2','Le Chargé de mission DR/JEC N°1')}${sg('sig3','Le Chef de Centre CMPJ/REF')}</div></div>`}
function printB(f,list){$('#bul').innerHTML=list.map(x=>bulletin(f,x)).join('');setTimeout(()=>window.print(),150)}

/* ---- Excel ---- */
function exportX(list){const wb=XLSX.utils.book_new();list.forEach(f=>{const r=rows(f),g=parse(f.general),t=[...parse(f.theo),...parse(f.prat)];
 const h=['Nom',...g.map(x=>x.l),'Total Pts1','Moy1',...t.map(x=>x.l),'Total Pts2','Moy2','Points globaux','Moy gén.','Rang','Mention','Décision'];
 const cf=['Coef',...g.map(x=>x.c),'','',...t.map(x=>x.c)];
 const d=r.map(x=>{const n=l=>S.gr[gid(f,x.s.id)]?.notes?.[l]??'';return[x.s.name,...g.map(y=>n(y.l)),fmt(x.c.t1),fmt(x.c.m1),...t.map(y=>n(y.l)),fmt(x.c.t2),fmt(x.c.m2),fmt(x.c.tot),fmt(x.c.mg),rg(x),mention(x.c.mg),decision(x.c.mg)]});
 XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([h,cf,...d]),f.name.replace(/[\\\/?*\[\]:]/g,' ').slice(0,31))});
 XLSX.writeFile(wb,'Resultats_'+new Date().toISOString().slice(0,10)+'.xlsx')}
function shrink(file,cb){const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,420/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/png'))};im.src=rd.result};rd.readAsDataURL(file)}

/* ---- événements ---- */
const val=(id,k)=>document.querySelector(`[data-id="${id}"][data-k="${k}"]`).value.trim();
const cur=()=>S.fil.find(x=>x.id===S.fid);
document.addEventListener('input',e=>{const t=e.target;if(!t.classList?.contains('n'))return;const f=cur(),id=gid(f,t.dataset.s);
 if(parseFloat(t.value)>20)t.value=20;S.gr[id]=S.gr[id]||{filiere:f.id,student:t.dataset.s,notes:{}};S.gr[id].notes[t.dataset.l]=t.value;
 rows(f).forEach(x=>{const tr=document.querySelector(`tr[data-s="${x.s.id}"]`);if(!tr)return;tr.querySelector('.m1').textContent=r2(x.c.m1);tr.querySelector('.m2').textContent=r2(x.c.m2);tr.querySelector('.mg').innerHTML='<b>'+r2(x.c.mg)+'</b>';tr.querySelector('.rk').textContent=rg(x)})});
document.addEventListener('change',e=>{const t=e.target,f=cur();
 if(t.classList?.contains('n')){const id=gid(f,t.dataset.s);setDoc(doc(db,'grades',id),{filiere:f.id,student:t.dataset.s,notes:S.gr[id].notes},{merge:true}).catch(x=>toast(errmsg(x)))}
 if(t.dataset?.img)shrink(t.files[0],u=>{S.set[t.dataset.img]=u;render()})});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,d=b.dataset,f=cur();
 try{
 if(a==='nav'){S.view=d.v;S.fid=d.f||null;S.tab='notes';return render()}
 if(a==='tab'){S.tab=d.t;return render()}
 if(a==='login')return await signInWithEmailAndPassword(auth,$('#le').value.trim(),$('#lp').value).catch(x=>toast(errmsg(x)));
 if(a==='logout'){S.view='home';return signOut(auth)}
 if(a==='init'){const w=writeBatch(db);w.set(doc(db,'meta','init'),{at:Date.now()});w.set(doc(db,'users',S.user.uid),{name:S.user.email,email:S.user.email,role:'admin',filieres:[]});return await w.commit()}
 if(a==='export')return exportX([f]);if(a==='exportAll')return exportX(myFil());
 if(a==='print')return printB(f,rows(f).filter(x=>x.s.id===d.s));if(a==='printAll')return printB(f,rows(f));
 if(a==='addStu'){const names=$('#sn').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!names.length)return;const w=writeBatch(db);names.forEach(n=>w.set(doc(collection(db,'students')),{filiere:f.id,name:n}));await w.commit();return toast(names.length+' élève(s) ajouté(s)')}
 if(a==='delStu'){if(!confirm('Retirer cet élève et ses notes ?'))return;await deleteDoc(doc(db,'grades',gid(f,d.s))).catch(()=>{});return await deleteDoc(doc(db,'students',d.s))}
 if(a==='newFil')return await setDoc(doc(collection(db,'filieres')),{name:'Nouvelle filière',general:'Fra:1,Angl:1',theo:'',prat:''});
 if(a==='models'){const w=writeBatch(db);MODELS.forEach(m=>w.set(doc(collection(db,'filieres')),m));return await w.commit()}
 if(a==='saveFil'){await setDoc(doc(db,'filieres',d.f),{name:val(d.f,'name'),general:val(d.f,'general'),theo:val(d.f,'theo'),prat:val(d.f,'prat')});return toast('Filière enregistrée')}
 if(a==='delFil'){if(confirm('Supprimer cette filière ? Les élèves et notes resteront en base mais ne seront plus visibles.'))await deleteDoc(doc(db,'filieres',d.f));return}
 if(a==='createUser'){const name=$('#un').value.trim(),email=$('#ue').value.trim(),pw=$('#up').value,role=$('#ur').value,fl=[...document.querySelectorAll('#nf .uf:checked')].map(x=>x.value);
  if(!name||!email||pw.length<6)return toast('Nom, e-mail et mot de passe (6 caractères minimum) sont requis.');
  const sec=initializeApp(CFG,'sec'+Date.now());try{const c=await createUserWithEmailAndPassword(getAuth(sec),email,pw);await setDoc(doc(db,'users',c.user.uid),{name,email,role,filieres:fl});toast('Compte créé pour '+name)}catch(x){toast(errmsg(x))}finally{await signOut(getAuth(sec)).catch(()=>{});deleteApp(sec)}return}
 if(a==='saveUser'){const c=document.querySelector(`[data-u="${d.u}"]`),u=S.users.find(x=>x.id===d.u);await setDoc(doc(db,'users',d.u),{...u,id:undefined,role:c.querySelector('.ur').value,filieres:[...c.querySelectorAll('.uf:checked')].map(x=>x.value)});return toast('Droits enregistrés')}
 if(a==='resetUser'){await sendPasswordResetEmail(auth,d.e);return toast('Lien envoyé à '+d.e)}
 if(a==='delUser'){if(d.u===S.user.uid)return toast('Vous ne pouvez pas retirer votre propre accès.');if(confirm('Retirer l\'accès de ce compte ?'))await deleteDoc(doc(db,'users',d.u));return}
 if(a==='clrImg'){delete S.set[d.k];return render()}
 if(a==='saveSet'){await setDoc(doc(db,'settings','main'),{...S.set,lines:$('#sl').value,session:$('#ss').value,seuil:$('#sd').value,sigOn:$('#so').checked});return toast('Réglages enregistrés')}
 if(a==='chpw'){const n=$('#pn').value;if(n.length<6)return toast('6 caractères minimum.');await reauthenticateWithCredential(S.user,EmailAuthProvider.credential(S.user.email,$('#po').value));await updatePassword(S.user,n);$('#po').value=$('#pn').value='';return toast('Mot de passe modifié')}
 }catch(x){toast(errmsg(x))}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='lp')document.querySelector('[data-act=login]').click()});
render();
</script></body></html>
